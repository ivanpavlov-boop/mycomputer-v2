name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-image-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Image guard command tests
        run: node --test scripts/tests/backend-image-guard.test.cjs
      - name: Build backend test image
        run: docker build --tag mycomputer-backend-permission-test:ci .
      - name: Check non-root readability, autoload and rejected permissions
        run: bash scripts/tests/backend-image-permissions.sh mycomputer-backend-permission-test:ci

  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mycomputer_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, mbstring, pdo_mysql, pcntl, redis, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycomputer_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SCOUT_DRIVER: database

      - name: Prepare test database
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycomputer_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SCOUT_DRIVER: database

      - name: Pint
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycomputer_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SCOUT_DRIVER: database

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Build frontend
        run: npm run build

  frontend-card-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated evidence directory
        run: |
          mkdir "$RUNNER_TEMP/card-cache-evidence"
          echo "NGINX_BINARY=$RUNNER_TEMP/card-cache-nginx/usr/sbin/nginx" >> "$GITHUB_ENV"
          echo "NGINX_FASTCGI_PARAMS=$RUNNER_TEMP/card-cache-nginx/etc/nginx/fastcgi_params" >> "$GITHUB_ENV"
          echo "NGINX_TEST_OUTPUT=$RUNNER_TEMP/card-cache-evidence/proxy" >> "$GITHUB_ENV"
          echo "APACHE_BINARY=/usr/sbin/apache2" >> "$GITHUB_ENV"
          echo "APACHE_MODULE_DIR=/usr/lib/apache2/modules" >> "$GITHUB_ENV"
          echo "REQUIRE_APACHE=1" >> "$GITHUB_ENV"

      - name: Install frontend
        run: npm ci

      - name: Provision isolated Linux Nginx and Apache binaries
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            # apache2-bin supplies binaries/modules, not the apache2 service package.
            sudo apt-get install -y --no-install-recommends apache2-bin
            mkdir "$RUNNER_TEMP/card-cache-packages" "$RUNNER_TEMP/card-cache-nginx"
            cd "$RUNNER_TEMP/card-cache-packages"
            apt-get download nginx nginx-common
            for package in ./*.deb; do
              dpkg-deb --extract "$package" "$RUNNER_TEMP/card-cache-nginx"
            done
            test -x "$NGINX_BINARY"
            test -f "$NGINX_FASTCGI_PARAMS"
            test -x "$APACHE_BINARY"
            for module in mpm_event authz_core proxy proxy_http; do
              test -f "$APACHE_MODULE_DIR/mod_${module}.so"
            done
            node --version
            "$NGINX_BINARY" -V
            "$APACHE_BINARY" -v
          } 2>&1 | tee "$RUNNER_TEMP/card-cache-evidence/provision.log"

      - name: Validate Apache encoded paths and real public image cache
        run: |
          set -euo pipefail
          node test/nginx/card-cache.mjs \
            > >(tee "$RUNNER_TEMP/card-cache-evidence/stdout.log") \
            2> >(tee "$RUNNER_TEMP/card-cache-evidence/stderr.log" >&2)

      - name: Upload Nginx evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-card-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/card-cache-evidence/*.log
            ${{ runner.temp }}/card-cache-evidence/proxy/results.json
            ${{ runner.temp }}/card-cache-evidence/proxy/*.conf
            ${{ runner.temp }}/card-cache-evidence/proxy/events.jsonl
            ${{ runner.temp }}/card-cache-evidence/proxy/fastcgi_params
            ${{ runner.temp }}/card-cache-evidence/proxy/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  frontend-card-cache-alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable harness from the project Nginx runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/card-cache-alpine-evidence"
          {
            docker pull nginx:1.27-alpine
            docker image inspect nginx:1.27-alpine > "$RUNNER_TEMP/card-cache-alpine-evidence/base-image.json"
            base=$(docker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}')
            test -n "$base"
            docker build --build-arg "NGINX_IMAGE=$base" \
              -f frontend/test/nginx/Dockerfile.alpine -t card-cache-alpine:ci .
            docker image inspect card-cache-alpine:ci > "$RUNNER_TEMP/card-cache-alpine-evidence/fixture-image.json"
          } 2>&1 | tee "$RUNNER_TEMP/card-cache-alpine-evidence/provision.log"

      - name: Validate Alpine cache as the Nginx runtime user
        shell: bash
        run: |
          set -euo pipefail
          docker create --name card-cache-alpine-fixture card-cache-alpine:ci
          docker start --attach card-cache-alpine-fixture \
            > >(tee "$RUNNER_TEMP/card-cache-alpine-evidence/stdout.log") \
            2> >(tee "$RUNNER_TEMP/card-cache-alpine-evidence/stderr.log" >&2)
          test "$(docker inspect card-cache-alpine-fixture --format '{{.State.ExitCode}}')" = 0

      - name: Collect evidence and remove only this disposable container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker inspect card-cache-alpine-fixture > "$RUNNER_TEMP/card-cache-alpine-evidence/container.json" 2>/dev/null; then
            trap 'docker rm -f card-cache-alpine-fixture' EXIT
            docker cp card-cache-alpine-fixture:/evidence/. "$RUNNER_TEMP/card-cache-alpine-evidence/"
          fi

      - name: Upload Alpine evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-card-cache-alpine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/card-cache-alpine-evidence/*.json
            ${{ runner.temp }}/card-cache-alpine-evidence/*.log
            ${{ runner.temp }}/card-cache-alpine-evidence/proxy/results.json
            ${{ runner.temp }}/card-cache-alpine-evidence/proxy/events.jsonl
            ${{ runner.temp }}/card-cache-alpine-evidence/proxy/*.conf
            ${{ runner.temp }}/card-cache-alpine-evidence/proxy/fastcgi_params
            ${{ runner.temp }}/card-cache-alpine-evidence/proxy/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  frontend-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build frontend
        run: npm run build

      - name: Browser tests
        run: npm run test:browser:ci

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
