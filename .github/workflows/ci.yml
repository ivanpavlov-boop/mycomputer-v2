name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-image-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Image guard command tests
        run: node --test scripts/tests/backend-image-guard.test.cjs
      - name: Build backend test image
        run: docker build --tag mycomputer-backend-permission-test:ci .
      - name: Check non-root readability, autoload and rejected permissions
        run: bash scripts/tests/backend-image-permissions.sh mycomputer-backend-permission-test:ci

  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mycomputer_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, mbstring, pdo_mysql, pcntl, redis, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycomputer_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SCOUT_DRIVER: database

      - name: Prepare test database
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycomputer_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SCOUT_DRIVER: database

      - name: Pint
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mycomputer_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SCOUT_DRIVER: database

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Build frontend
        run: npm run build

  frontend-card-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      NGINX_BINARY: ${{ runner.temp }}/card-cache-nginx/usr/sbin/nginx
      NGINX_FASTCGI_PARAMS: ${{ runner.temp }}/card-cache-nginx/etc/nginx/fastcgi_params
      NGINX_TEST_OUTPUT: ${{ runner.temp }}/card-cache-evidence/proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated evidence directory
        run: mkdir "$RUNNER_TEMP/card-cache-evidence"

      - name: Install frontend
        run: npm ci

      - name: Extract Linux Nginx without installing a service
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            mkdir "$RUNNER_TEMP/card-cache-packages" "$RUNNER_TEMP/card-cache-nginx"
            cd "$RUNNER_TEMP/card-cache-packages"
            apt-get download nginx nginx-common
            for package in ./*.deb; do
              dpkg-deb --extract "$package" "$RUNNER_TEMP/card-cache-nginx"
            done
            test -x "$NGINX_BINARY"
            test -f "$NGINX_FASTCGI_PARAMS"
            node --version
            "$NGINX_BINARY" -V
          } 2>&1 | tee "$RUNNER_TEMP/card-cache-evidence/provision.log"

      - name: Validate config and real public image cache
        run: |
          set -euo pipefail
          node test/nginx/card-cache.mjs \
            > >(tee "$RUNNER_TEMP/card-cache-evidence/stdout.log") \
            2> >(tee "$RUNNER_TEMP/card-cache-evidence/stderr.log" >&2)

      - name: Upload Nginx evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-card-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/card-cache-evidence/*.log
            ${{ runner.temp }}/card-cache-evidence/proxy/results.json
            ${{ runner.temp }}/card-cache-evidence/proxy/nginx.conf
            ${{ runner.temp }}/card-cache-evidence/proxy/fastcgi_params
            ${{ runner.temp }}/card-cache-evidence/proxy/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  frontend-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build frontend
        run: npm run build

      - name: Browser tests
        run: npm run test:browser:ci

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
